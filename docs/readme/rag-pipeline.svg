<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 300" width="1360" height="300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-label="How one question flows through the RAG pipeline">
