<text x="42.0" y="134" fill="#efeee6" font-size="11" font-family="'Courier New',monospace">STEP 1</text>
<text x="42.0" y="160" fill="#efeee6" font-size="16" font-weight="600">Question</text>
<text x="42.0" y="182" fill="#8fa1b3" font-size="11" font-family="'Courier New',monospace">“Is that bad?”</text>
