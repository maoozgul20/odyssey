<g filter="url(#g)"><rect x="-60" y="-2" width="60" height="4" fill="url(#trail)"/><circle r="6" fill="#4ee59a"/>
<animateMotion dur="8.0s" repeatCount="indefinite" path="M30,214 H1330"/></g>
<text x="30" y="250" fill="#8fa1b3" font-size="13">Only lines spoken before the current mission time are searchable, so the crew never knows the future. Weak matches are dropped, and if nothing relevant is found the answer says so.</text>
<text x="30" y="274" fill="#8fa1b3" font-size="13">Answers stream token by token and every claim points back to a numbered radio excerpt.</text>
</svg>